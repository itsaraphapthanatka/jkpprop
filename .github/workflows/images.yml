# Build the two images on GitHub's runners, not on the VPS.
#
# The VPS has 3.9 GB of RAM, two cores and eighteen other production
# containers on it. A Next.js build there took the machine's free memory from
# 1.4 GB to 66 MB and its page cache from 1.4 GB to 137 MB, so every other
# service had to read itself back off the disk; the box stopped answering and
# had to be rebooted by hand. Nothing about that build needs to happen on the
# machine that serves the site.
#
# What comes out: ghcr.io/<owner>/jkpprop-app and …/jkpprop-migrate, tagged
# both `latest` and the commit sha, so a bad deploy can be rolled back to a
# known image rather than rebuilt.
name: images

on:
  push:
    branches: [main, deploy/behind-nginx]
    paths:
      - 'web/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # both images every time: the migrate image carries the schema, and an
      # app built against a migration the database has not had applied is the
      # one combination that breaks production
      matrix:
        include:
          - name: jkpprop-app
            file: web/Dockerfile
          - name: jkpprop-migrate
            file: web/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # provided to every workflow run; no secret to create or rotate
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: ${{ matrix.file }}
          # the VPS is x86_64; the Mac these are often built on is not
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          # a build cache that lives in the registry, so a run that changes one
          # component does not reinstall node_modules from scratch
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Put the built image on the VPS.
  #
  # The key this uses cannot open a shell there. sshd runs
  # /srv/jkpprop/deploy-only.sh instead of whatever is asked for, and that
  # accepts one word — `deploy` with an optional sha — before handing over to
  # the deploy script. The box serves eighteen other people's sites; a key in a
  # CI secret should be able to do exactly one thing.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/deploy/behind-nginx'
    runs-on: ubuntu-latest
    # never two deploys at once, and never cancel one half-done
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: ship it
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          HOSTKEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          test -n "$KEY" || { echo "ยังไม่ได้ตั้ง secret VPS_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # the server's own key, so this cannot be talked into deploying to
          # somebody else's machine
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          # The migrate image is over a gigabyte; the pull runs silent for
          # minutes and the connection was dropped under it. Keepalives hold
          # the channel open while the far end says nothing.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$USER@$HOST" "deploy ${{ github.sha }}"
