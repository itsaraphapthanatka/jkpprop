# JKP Property — single-VPS deployment.
#
#   cp .env.deploy.example .env && edit it
#   docker compose up -d --build
#
# Caddy obtains and renews the TLS certificate on its own, which matters more
# than usual here: the session cookie is `secure` in production, so the admin
# is unusable over plain http.

name: jkpprop

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jkpprop}
    volumes:
      - db-data:/var/lib/postgresql/data
      # nightly dumps land here — see DEPLOY.md
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jkp} -d ${POSTGRES_DB:-jkpprop}']
      interval: 10s
      timeout: 5s
      retries: 5
    # not published: only the app talks to it
    expose:
      - '5432'

  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jkp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jkpprop}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jkp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jkpprop}
      # read at runtime by sitemap.xml and the hreflang alternates
      SITE_URL: https://${DOMAIN}
      # uploads stay on disk; set the S3_* vars instead to move them off-box
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      # without this every redeploy loses every uploaded photo
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
