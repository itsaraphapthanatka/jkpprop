# JKP Property — for a VPS that already runs nginx for other sites.
#
#   docker compose -f docker-compose.behind-nginx.yml up -d
#
# Differences from docker-compose.yml (the standalone stack):
#
#   * no Caddy. The host's nginx already owns 80/443 and holds certbot
#     certificates for every site on the box; starting a second thing that
#     wants those ports either fails or takes the other sites down.
#   * the app publishes to 127.0.0.1 only, so it is reachable from nginx on
#     the host but not from the internet. This matches how the other
#     containers on such a box are usually wired.
#   * images are pulled from a tarball built elsewhere rather than built
#     here — a shared box rarely has the free RAM for a Next.js build, and an
#     OOM during `npm run build` can get neighbouring containers killed too.
#
# See DEPLOY_NGINX.md for the nginx server block that goes with this.

name: jkpprop

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jkpprop}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jkp} -d ${POSTGRES_DB:-jkpprop}']
      interval: 10s
      timeout: 5s
      retries: 5
    # host-loopback only, so a GUI client can reach it through an SSH tunnel
    # and nothing else can. Never change this to a bare "5435:5432" — that
    # publishes Postgres to the internet, and docker's own iptables rules sit
    # in front of ufw, so the firewall will not save you.
    ports:
      - '127.0.0.1:${DB_PORT:-5435}:5432'

  migrate:
    # Set by deploy/pull-and-restart.sh to a ghcr.io tag. The bare local name
    # is the fallback, so a box that has not moved to the registry yet still
    # comes up from whatever `docker load` put there.
    image: ${MIGRATE_IMAGE:-jkpprop-migrate:latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jkp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jkpprop}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    image: ${APP_IMAGE:-jkpprop-app:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jkp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jkpprop}
      SITE_URL: https://${DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # host-only: nginx proxies to this, the internet cannot reach it directly
    ports:
      - '127.0.0.1:${APP_PORT:-3110}:3000'

volumes:
  db-data:
  uploads:
