########################################
# jkppropertyagency.com — reverse proxy to the app container
#
# Goes with docker-compose.behind-nginx.yml, which publishes the app on
# 127.0.0.1:3100. Nothing here terminates TLS itself; the certificate lines
# below are certbot's and are left exactly as certbot wrote them so that
# `certbot renew` keeps working untouched.
########################################

server {
    server_name jkppropertyagency.com www.jkppropertyagency.com;

    # Photo uploads. nginx defaults to 1m, which rejects most phone camera
    # images with a 413 before the request ever reaches the app.
    client_max_body_size 25m;

    # Let's Encrypt HTTP-01, served from disk rather than proxied so that
    # renewal does not depend on the app being up.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jkppropertyagency.com/html;
        allow all;
    }

    # Immutable build assets — the filename contains a content hash, so this
    # is safe to cache hard and keeps static traffic off Node entirely.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # the app issues `secure` session cookies; without this it sees plain
        # http behind the proxy and login silently loops
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # No WebSocket upgrade block on purpose: a production `next start`
        # serves no sockets (HMR is dev-only), and $connection_upgrade would
        # need a map in the shared http context — config every other site on
        # this box also loads.

        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/jkppropertyagency.com.access.log;
    error_log  /var/log/nginx/jkppropertyagency.com.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jkppropertyagency.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jkppropertyagency.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.jkppropertyagency.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jkppropertyagency.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name jkppropertyagency.com www.jkppropertyagency.com;
    return 404; # managed by Certbot
}
